<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JobBoard - Login</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">


  <!-- Navbar -->
  <nav class="bg-white shadow px-6 py-4">

    <a href="index.html"
      class="text-2xl font-bold text-blue-600">
      JobBoard
    </a>

  </nav>


  <!-- Login Section -->
  <section class="min-h-screen flex items-center justify-center px-5">

    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">

      <h2 class="text-3xl font-bold text-gray-800 text-center">
        Welcome Back
      </h2>

      <p class="text-gray-500 text-center mt-2">
        Login to your JobBoard account
      </p>


      <!-- Email -->
      <div class="mt-8">

        <label class="block text-sm font-medium text-gray-700 mb-2">
          Email
        </label>

        <input
          type="email"
          placeholder="Enter your email"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500">

      </div>


      <!-- Password -->
      <div class="mt-5">

        <label class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>

        <input
          type="password"
          placeholder="Enter your password"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500">

      </div>


      <!-- Forgot Password -->
      <div class="text-right mt-3">

        <a href="#" class="text-sm text-blue-600 hover:underline">
          Forgot Password?
        </a>

      </div>


      <!-- Login Button -->
      <button
        class="w-full bg-blue-600 text-white py-3 rounded-lg mt-6 hover:bg-blue-700 font-semibold">
        Login
      </button>


      <!-- Register -->
      <p class="text-center text-sm text-gray-500 mt-6">

        Don't have an account?

        <a href="#" class="text-blue-600 font-medium hover:underline">
          Create Account
        </a>

      </p>

    </div>

  </section>

</body>
</html>
